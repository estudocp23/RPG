<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coração de Âmbar — RPG de masmorra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#080c12;--panel:#121b26;--panel2:#1a2634;--line:#2f4356;--amber:#f2a53a;--amber2:#a8641c;--bone:#eadfc4;--dim:#8ea2b3;--hp:#d8483f;--mp:#3f8fd8;--xp:#9b6fe0;--ok:#6fbf5a;--u:1px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--bone);font-family:'Pixelify Sans','Trebuchet MS',sans-serif;font-size:15px;line-height:1.35;overflow:hidden}
.hidden{display:none!important}
.dim{color:var(--dim)} .sm{font-size:13px} .gold{color:var(--amber)} .amber{color:var(--amber)}
.r0{color:#c9d1d6}.r1{color:#4aa3ff}.r2{color:#b26bff}.r3{color:#ffb02e}
.up{color:var(--ok);font-style:normal;font-size:12px}.down{color:#d86a5a;font-style:normal;font-size:12px}
.ic{width:32px;height:32px;image-rendering:pixelated;flex:none}
kbd{font-family:inherit;font-size:.8em;background:#0a1018;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--dim)}
button{font-family:inherit;font-size:inherit;color:var(--bone);background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;transition:background .12s,border-color .12s,transform .06s}
button:hover:not(:disabled){border-color:var(--amber);background:#223345}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
button.x{padding:3px 8px;color:var(--dim)}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) 124px;gap:8px;padding:8px;max-width:1640px;margin:0 auto}
#top{display:flex;align-items:center;gap:14px;padding:2px 4px}
#top .brand{font-weight:700;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;font-size:17px}
#top #place{color:var(--dim);flex:1}
#top button{padding:3px 10px;font-size:14px}
#main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px;min-height:0}
#stageWrap{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;background:#04060a;border:2px solid var(--line)}
#stage{position:relative;overflow:hidden;background:#05060a}
#cv{width:100%;height:100%;display:block}
.frame{background:var(--panel);border:2px solid var(--line)}
#side{display:flex;flex-direction:column;gap:8px;min-height:0}
#status{padding:10px}
.st-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.st-top .pt{width:56px;height:56px;image-rendering:pixelated;background:#0a1018;border:2px solid var(--amber2)}
.st-top .who{flex:1;display:flex;flex-direction:column}.st-top .who b{font-size:18px}.st-top .who span{color:var(--dim)}
.purse{display:flex;align-items:center;gap:4px;font-size:18px;color:var(--amber)}
#status label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.bar{position:relative;height:18px;background:#070b11;border:2px solid #0a1018;outline:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .25s}.bar span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:14px;text-shadow:0 1px 0 #000,0 0 3px #000}
.bar.hp i{background:linear-gradient(#f0766c,var(--hp) 45%,#9a2a24)}.bar.mp i{background:linear-gradient(#77b8f2,var(--mp) 45%,#245a94)}.bar.xp i{background:linear-gradient(#c3a2f4,var(--xp) 45%,#5d3aa6)}
.bar.sm{height:10px}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:9px}
.attrs span{background:var(--panel2);padding:3px 6px;font-size:12px;color:var(--dim);display:flex;flex-direction:column}.attrs b{color:var(--bone);font-size:16px}
.bless{margin-top:7px;font-size:13px;color:#c9a8ff}
#tabs{display:flex;gap:4px}
#tabs button{flex:1;position:relative;border-bottom:none;border-radius:3px 3px 0 0;color:var(--dim)}
#tabs button.on{background:var(--panel);color:var(--amber);border-color:var(--amber2)}
#qBadge,#tBadge{position:absolute;top:-6px;right:-4px;background:var(--amber);color:#1a1206;border-radius:9px;min-width:18px;height:18px;font-size:12px;line-height:18px}
#tabBody{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;margin-top:-8px}
h4{margin:8px 0 5px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:3px}
h4 .dim{text-transform:none;letter-spacing:0;float:right}
.cons{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.con{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:2px 6px;padding:4px 6px;text-align:left}
.con b{font-size:17px}.con small{grid-column:1/3;font-size:11px;color:var(--dim)}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #223040}
.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--dim);font-size:12.5px}
.row.lock{opacity:.5}
.row button{padding:3px 8px;font-size:13px;white-space:nowrap}
.quest{background:var(--panel2);border-left:3px solid var(--line);padding:6px 8px;margin-bottom:6px}
.quest.main{border-left-color:var(--amber)}.quest.done{border-left-color:var(--ok)}
.quest p{margin:3px 0 5px;font-size:13px;color:#c5cbd0}.quest small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.quest i{font-style:normal;font-size:11px;background:var(--xp);color:#fff;padding:0 5px;border-radius:2px;margin-left:4px}
.quest button{margin-top:5px}
#log{overflow-y:auto;padding:7px 12px;font-size:15px}
#log p{margin:1px 0;color:#9fb0bf}#log p:last-child{color:var(--bone)}
#log b{color:#fff}
#log p.quest{background:none;border:0;padding:0;margin:1px 0}
#log .dmg{color:#f08a7e}#log .hit{color:#e6d6a8}#log .heal{color:#8fdc7f}#log .gold{color:var(--amber)}#log .loot{color:#7fd0ff}#log .lvl{color:#c9a8ff}#log .quest{color:#f0c878}#log .sys{color:#7f93a6}#log .warn{color:#ff9a5a}
/* sobreposições do palco */
#hint{position:absolute;left:50%;bottom:calc(var(--u)*26);transform:translateX(-50%);background:rgba(8,12,18,.86);border:2px solid var(--line);padding:3px 12px;font-size:max(12px,calc(var(--u)*20));pointer-events:none;white-space:nowrap}
body:not([data-mode=play]) #hint{display:none}
#fade{position:absolute;inset:0;background:#05060a;opacity:0;pointer-events:none;transition:opacity .3s linear;z-index:40}
#toasts{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*16);display:flex;flex-direction:column;gap:6px;z-index:35;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:rgba(10,15,22,.94);border:2px solid var(--amber2);padding:5px 12px 5px 8px;animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast small{display:block;color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.toast.out{opacity:0;transform:translateX(-20px)}
@keyframes tin{from{opacity:0;transform:translateX(-24px)}}
#dialog{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(10,15,22,.95);border:2px solid var(--amber2);box-shadow:0 0 0 2px var(--ink);padding:calc(var(--u)*18) calc(var(--u)*22);display:flex;gap:calc(var(--u)*18);z-index:20;cursor:pointer;font-size:max(13px,calc(var(--u)*23))}
#dlgPt{width:calc(var(--u)*120);height:calc(var(--u)*120);min-width:60px;min-height:60px;image-rendering:pixelated;background:#0a1018;border:2px solid var(--line);flex:none}
#dialog .body{flex:1;min-height:calc(var(--u)*110)}
#dlgName{color:var(--amber);font-weight:700;margin-bottom:4px}
#dlgText{white-space:pre-wrap}
#dlgOpts{display:flex;flex-direction:column;gap:5px;margin-top:8px;align-items:flex-start}
#dlgOpts button{font-size:inherit;text-align:left}#dlgOpts kbd{margin-right:8px}
#dlgNext{position:absolute;right:14px;bottom:8px;color:var(--amber);font-size:.8em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#modal{position:absolute;inset:0;background:rgba(4,6,10,.72);display:flex;align-items:center;justify-content:center;z-index:35;padding:3%}
.win{background:var(--panel);border:2px solid var(--amber2);box-shadow:0 0 0 2px var(--ink),0 12px 40px #000;width:min(100%,420px);max-height:100%;display:flex;flex-direction:column;padding:12px 14px}
.win.wide{width:min(100%,720px)}
.win header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--line);padding-bottom:7px;margin-bottom:8px}
.win h3{margin:0;font-size:21px;color:var(--amber);flex:1}
.win nav{display:flex;gap:6px;margin-bottom:6px}.win nav button.on{border-color:var(--amber);color:var(--amber)}
.win .list{overflow-y:auto;min-height:0;padding-right:4px}
.win .list.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start}.win .list.cols h4{grid-column:1/-1}
.win p{margin:4px 0 8px}
.win .menu,.title .menu,.overS .menu{display:flex;flex-direction:column;gap:7px}
.win .menu button{padding:8px;font-size:16px}
.vol{display:flex;align-items:center;gap:8px}.vol span{flex:1;text-align:center}
.win table{width:100%;border-collapse:collapse;font-size:14px}.win th{color:var(--amber);text-align:left;font-weight:700;border-bottom:1px solid var(--line)}.win td,.win th{padding:4px 6px}
.win .foot{margin-top:10px;text-align:right}.help p{color:#c5cbd0}
#screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;overflow-y:auto;font-size:max(13px,calc(var(--u)*20))}
#screen.titleS{background:linear-gradient(90deg,rgba(5,7,12,.93) 0%,rgba(5,7,12,.72) 42%,rgba(5,7,12,.1) 100%);justify-content:flex-start;padding-left:7%}
#screen.pick,#screen.over{background:rgba(5,7,12,.96)}
.eyebrow{color:var(--amber);letter-spacing:.2em;text-transform:uppercase;font-size:.72em;margin:0 0 6px}
.title h1{font-size:calc(var(--u)*104);line-height:.86;margin:0 0 calc(var(--u)*34);color:var(--bone);font-weight:700;letter-spacing:-.01em;text-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 var(--amber2)}
.title .menu{width:calc(var(--u)*330);min-width:180px}.title .menu button,.overS .menu button{font-size:1.05em;padding:.45em .8em;text-align:left}
.title .menu button:first-child,.overS .menu button:first-child{border-color:var(--amber);color:var(--amber)}
.pickS{width:92%;text-align:center}.pickS h2,.overS h2{font-size:1.9em;margin:0 0 .5em}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*12);margin-bottom:14px}
.card{display:flex;flex-direction:column;align-items:center;padding:calc(var(--u)*14);font-size:.82em;text-align:center;background:var(--panel)}
.card img{width:calc(var(--u)*176);height:calc(var(--u)*176);image-rendering:pixelated;animation:bob 1.1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.card h3{margin:0 0 4px;font-size:1.5em;color:var(--amber)}.card p{margin:0 0 8px;color:#c5cbd0;min-height:4.2em}.card small{color:var(--dim);margin-top:6px}
.mini{display:grid;grid-template-columns:5.6em 1fr;gap:6px;align-items:center;width:100%;text-align:left;color:var(--dim)}.mini i{height:7px;background:#070b11;display:block}.mini u{display:block;height:100%;background:var(--amber)}
.ghost{background:none}
.overS{width:min(88%,640px);text-align:center}.overS h2{color:#f0766c}.overS h2.amber{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.stats span{background:var(--panel);border:1px solid var(--line);padding:6px;font-size:.68em;color:var(--dim);display:flex;flex-direction:column}.stats b{color:var(--bone);font-size:1.5em}
.overS .menu{flex-direction:row;justify-content:center;margin:12px 0}
/* combate */
#battleUI{position:absolute;inset:0;z-index:10;pointer-events:none;font-size:max(11px,calc(var(--u)*19))}
#battleUI>*{pointer-events:auto}
#turnBar{position:absolute;top:calc(var(--u)*14);left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(8,12,18,.8);padding:4px 8px;border:2px solid var(--line);white-space:nowrap}
#turnBar span{color:var(--dim);margin-right:4px;font-size:.8em;text-transform:uppercase;letter-spacing:.1em}
#turnBar b{padding:1px 7px;background:#3a1a18;color:#f0a8a0;font-weight:400;font-size:.85em}#turnBar b.me{background:#3a2c10;color:var(--amber)}#turnBar b.now{outline:2px solid var(--bone)}
#bMsg{position:absolute;top:calc(var(--u)*72);left:50%;transform:translateX(-50%);background:rgba(8,12,18,.9);border:2px solid var(--amber2);padding:5px 18px;color:var(--amber);font-size:1.15em;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:80%}
#bMsg.show{opacity:1}
#bHero{position:absolute;left:2%;bottom:3%;width:25%;background:rgba(10,15,22,.92);border:2px solid var(--line);padding:8px 10px}
#bHero .nm{margin-bottom:4px}#bHero .nm.sm{margin-top:6px;font-size:.8em;color:var(--dim)}#bHero .bar{margin-bottom:4px;height:calc(var(--u)*22);min-height:14px}#bHero .bar span{font-size:.75em;line-height:calc(var(--u)*18)}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:1.2em}.chips i{font-style:normal;font-size:.72em;padding:0 5px;border:1px solid var(--c);color:var(--c)}
#bInfo{position:absolute;left:29%;right:2%;bottom:calc(3% + var(--u)*96);min-height:1.5em;text-shadow:0 2px 0 #000,0 0 6px #000;font-size:.92em}
#bMenu{position:absolute;left:29%;right:2%;bottom:3%;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*8)}
#bMenu button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(var(--u)*8) 2px;background:rgba(18,27,38,.95);font-size:inherit;position:relative}
#bMenu .ic{width:calc(var(--u)*40);height:calc(var(--u)*40)}#bMenu kbd{position:absolute;top:3px;right:4px;font-size:.62em}
#bSub{position:absolute;left:29%;right:2%;bottom:calc(3% + var(--u)*130);background:rgba(10,15,22,.96);border:2px solid var(--amber2);padding:6px 8px;display:flex;flex-direction:column;gap:3px}
#bSub h4{margin:0 0 3px}
#bSub button{display:flex;align-items:center;gap:8px;text-align:left;padding:3px 8px;font-size:.92em}#bSub button span{flex:1}#bSub small{display:block;color:var(--dim);font-size:.8em}#bSub em{font-style:normal;color:#77b8f2;white-space:nowrap}#bSub .ic{width:calc(var(--u)*34);height:calc(var(--u)*34);min-width:20px;min-height:20px}
#bWin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(10,15,22,.96);border:2px solid var(--amber);box-shadow:0 0 0 2px var(--ink);padding:14px 28px;text-align:center;min-width:42%}
#bWin h3{margin:0 0 6px;font-size:1.8em;color:var(--amber)}#bWin p{margin:4px 0;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}#bWin .lvl{color:#c9a8ff}#bWin button{margin-top:10px;font-size:1em}
/* controles de toque */
@media (prefers-reduced-motion:reduce){.card img,#dlgNext{animation:none}}

/* ----- combate de ação ----- */
#battleUI #bHero{left:1.5%;top:2.5%;bottom:auto;width:27%;padding:6px 9px}
#battleUI #bHero .bar{height:calc(var(--u)*20)}
.pw{display:flex;align-items:center;gap:6px;margin-top:2px}.pw b{font-size:.7em;color:var(--amber);white-space:nowrap;font-weight:400}.pw .bar{flex:1;height:calc(var(--u)*12)!important;min-height:7px!important;margin:0!important}
.bar.pwr i{background:linear-gradient(#ffd98a,var(--amber) 45%,#a8641c);transition:width .1s}
.bless.pwl{color:var(--amber)}
#bItems{display:flex;gap:calc(var(--u)*6);margin-top:5px}
#bItems button{position:relative;flex:1;height:calc(var(--u)*50);min-height:30px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(18,27,38,.9)}
#bItems button .ic{width:auto;height:70%}#bItems button em{position:absolute;right:3px;bottom:0;font-style:normal;font-size:.8em;color:var(--bone)}#bItems button kbd{position:absolute;left:2px;top:2px;font-size:.55em}
#bItems button.off{opacity:.4}
body[data-mode=battle] #toasts{left:31%}
#battleUI #bMenu{left:auto;right:1.5%;bottom:2.5%;display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*8)}
.rowS,.rowA{display:flex;align-items:flex-end;gap:calc(var(--u)*8)}
#bMenu .rb{position:relative;opacity:.9;width:calc(var(--u)*72);height:calc(var(--u)*72);min-width:44px;min-height:44px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#2b3d52,#121b26 70%);border:calc(var(--u)*3) solid #4a6078;overflow:hidden;touch-action:none;user-select:none}
#bMenu .rb .ic{width:46%;height:46%}
#bMenu .rb small{font-size:.5em;color:var(--dim);line-height:1}
#bMenu .rb kbd{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:.48em;top:auto;bottom:4%;right:auto;border:0;background:none;color:#6f859a}
#bMenu .rb u{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5em;font-weight:700;color:#fff;pointer-events:none}
#bMenu .rb u:not(:empty){background:rgba(5,7,12,.72)}
#bMenu .rb.off{opacity:.5}
#bMenu .rb.sm{width:calc(var(--u)*58);height:calc(var(--u)*58);min-width:38px;min-height:38px;font-size:.62em;color:var(--dim)}
#bMenu .rb.sm.on{border-color:var(--ok);color:var(--ok)}
#bMenu .rb.big{width:calc(var(--u)*112);height:calc(var(--u)*112);min-width:64px;min-height:64px;background:radial-gradient(circle at 35% 30%,#e0574f,#7a1c1a 72%);border-color:#f0a8a0}
#bMenu .rb.big:active{transform:scale(.94)}
#bMenu .rb.spc{background:conic-gradient(var(--amber) var(--p,0%),#1a2634 0);border-color:var(--amber2)}
#bMenu .rb.spc.off{opacity:.8}
#bMenu .rb.spc.ready{animation:pulse .7s ease-in-out infinite alternate;border-color:#fff0a0}
@keyframes pulse{to{box-shadow:0 0 calc(var(--u)*26) var(--amber);transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#bMenu .rb.spc.ready{animation:none}}

/* ================= CELULAR ================= */
#cv{object-fit:contain}
#joy,#mhud,#ticker,#drawerHead,#drawerBg,#touch,#rotateMsg{display:none}
body.mobile{overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.mobile #app{display:block;height:100vh;height:100dvh;padding:0;max-width:none}
body.mobile #top{display:none}
body.mobile #main{display:block;height:100%}
body.mobile #stageWrap{height:100%;border:0;background:#05060a}
body.mobile #cv{touch-action:none}
/* mini status sobre o jogo: um único botão compacto, sem ocupar a tela */
body.mobile.ingame:is([data-mode=play],[data-mode=dialog],[data-mode=modal],[data-mode=busy]) #mhud{display:flex}
#mhud{position:absolute;left:8px;top:8px;z-index:12;flex-direction:column;align-items:center;gap:3px}
#mhud .mpt{position:relative;width:46px;height:46px;padding:0;border-radius:50%;border:2px solid var(--amber2);background:rgba(10,15,22,.88);overflow:visible}
#mhud .mpt img{width:100%;height:100%;border-radius:50%;image-rendering:pixelated;display:block}
#mhud .mpt b{position:absolute;right:-3px;bottom:-3px;background:var(--amber);color:#1a1206;font-size:10px;min-width:16px;line-height:15px;border-radius:8px;text-align:center}
#mHpBar{width:42px;height:6px;border-radius:3px;background:rgba(8,12,18,.85);border:1px solid var(--line);overflow:hidden}
#mHpBar i{display:block;height:100%;background:linear-gradient(90deg,#7a2320,#e0574f);transition:width .2s}
#mBadge{position:absolute;top:-5px;right:-5px;background:var(--amber);color:#1a1206;font-style:normal;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;text-align:center}
/* aviso para girar o celular na hora de jogar */
@media (orientation:portrait){body.mobile.touch.ingame:is([data-mode=play],[data-mode=dialog],[data-mode=busy]) #rotateMsg{display:flex}}
#rotateMsg{position:absolute;inset:0;z-index:70;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#05070d;color:var(--bone);text-align:center;padding:0 12%}
